name: Firebase Functions
on:
  pull_request: { paths: ["functions/**", "firestore.rules"] }
  push:
    branches: [dev, main]
    paths: ["functions/**", "firestore.rules"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - name: Deploy
        if: github.event_name == 'push'
        run: |
          npm i -g firebase-tools
          PROJECT=${{ github.ref_name == 'main' && 'dls-clone-prod' || 'dls-clone-dev' }}
          firebase deploy --only functions,firestore:rules --project $PROJECT
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
